# Toolchain pins — fuzzy majors here, exact versions in mise.lock (generated by
# `mise lock`, committed). CI installs with --locked and needs a download URL for
# every platform in lockfile_platforms. The stack module adds its runtimes to [tools].
# Where Renovate runs and may execute mise, it raises the locked versions weekly within
# their majors; by hand: just bump-tools.
[tools]
just = "1"
lefthook = "2"
gitleaks = "8"
go = "1.27.2" # exact: the release of the go.mod toolchain line, so CI tests what ships; bump both together
golangci-lint = "2"
"go:github.com/google/go-licenses/v2" = "2"

[settings]
lockfile = true
lockfile_platforms = [
  "linux-x64",
  "linux-x64-musl",
  "linux-arm64",
  "linux-arm64-musl",
  "macos-x64",
  "macos-arm64",
  "windows-x64",
]
