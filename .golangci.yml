version: "2"

linters:
  default: standard
  # Project: security and spelling on top of the standard set — this codebase is a
  # public auth boundary. Deliberate exceptions are documented inline via
  # //nolint:<linter> // reason.
  enable:
    - gosec
    - misspell
  exclusions:
    rules:
      # Tests: unchecked cleanup errors (Body.Close, os.RemoveAll, …) and
      # gosec taint findings against local stub servers are noise, not
      # signal. Production code keeps both linters in full.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
